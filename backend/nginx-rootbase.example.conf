# Nginx config for your-domain.com â€“ copy into your server block to fix 502
# Use the SAME port your Node app uses (default 5000). Set PORT in config.env if needed.
# On server: sudo nginx -t && sudo nginx -s reload

server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com www.your-domain.com;

    # If you use SSL (recommended), uncomment and point to your certs:
    # listen 443 ssl;
    # listen [::]:443 ssl;
    # ssl_certificate /path/to/fullchain.pem;
    # ssl_certificate_key /path/to/privkey.pem;

    # Allow large uploads (enrollment docs, photos, etc.) - default 1MB causes 413
    client_max_body_size 100M;

    # Proxy everything to Node (root and /api)
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_request_buffering off;  # Allow large uploads to stream to Node
    }

    # WebSocket support (optional, for Socket.IO)
    location /socket.io/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}

