# Netlify configuration for Spark School Management Portal

[build]
  base = "school portal"
  publish = "dist"
  command = "npm run build"

# Proxy API requests to Render backend
[[redirects]]
  from = "/api/*"
  to = "https://spark-school-management-portal.onrender.com/api/:splat"
  status = 200
  force = true

# Proxy WebSocket / Socket.io requests to Render backend
[[redirects]]
  from = "/socket.io/*"
  to = "https://spark-school-management-portal.onrender.com/socket.io/:splat"
  status = 200
  force = true

# Single Page Application fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
