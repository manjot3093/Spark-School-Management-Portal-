name: Keep Render Backend Awake

on:
  schedule:
    # Runs every 14 minutes to prevent Render free tier from sleeping (inactivity timeout is 15 min)
    - cron: '*/14 * * * *'
  workflow_dispatch:

jobs:
  ping-render:
    runs-on: ubuntu-latest
    steps:
      - name: Send keep-alive ping to Render
        run: |
          curl -sS --max-time 30 https://spark-school-management-portal.onrender.com/health || echo "Ping failed"
